# PORTABILITY DESIGN — do not put machine-specific paths in this file.
# These are CANONICAL CONTAINER paths, identical on every deployment. The host's real
# layout is mapped onto them per-machine:
#   - Docker (PROD): docker/docker-compose.yml binds ${VAULT_HOST}/${MEDIA_HOST}/${STATE_HOST}
#     (set in docker/.env, copied from docker/.env.example) onto /vault, /media, /app/state.
#   - Bare metal (DEV workstation): config.local.yaml (gitignored; copy from
#     config.local.yaml.example) overrides these with real Windows paths.
paths:
  vault_root: "/vault"
  saves_root: "/vault/SAVES"
  inbox_file: "/vault/0 - INBOX/SAVES.md"
  media_root: "/media"
  cookies_dir: "cookies"
  logs_dir: "logs"
  state_file: "/app/state/processing_state.json"
  pending_approvals_file: "/app/state/pending_approvals.json"
  queue_state_file: "/app/state/queue_state.json"   # serial approval queue (waiting/active/counters)

watcher:
  debounce_seconds: 3

processing:
  concurrent_downloads: 1
  retry_attempts: 3            # used by the remote-transcription retry (utils/retry.py)
  retry_delay_seconds: 30      # base backoff for that retry (exponential: 30s, 60s, …)
  skip_duplicates: true
  follow_profile_recipes: true  # "recipe in bio" posts: follow the bio link to the real recipe
  extract_timeout_seconds: 180  # hard cap on a single extractor.extract() await
  serial_approval: true         # ONE approval card at a time: the next URL isn't processed
                                # until you approve/skip the current one in Discord. Keeps the
                                # channel calm on a /crawl or big batch, and lets each save reuse
                                # the folder/tags you just set. Persisted (survives restarts).
                                # Set false for the old all-at-once behavior. See /queue.

crawl:
  enabled: true
  rate_limit_seconds: 2.0   # delay between enqueues from a /crawl (processing is serial
                            # downstream, so this is gentle pacing, not the primary throttle)
  max_recipes: 300          # safety cap on how many URLs one /crawl will queue

media:
  download_video: true
  download_images: true
  max_video_size_mb: 500
  video_quality: "bestvideo[height<=1080]+bestaudio/bestvideo+bestaudio/best"

transcription:
  enabled: true
  mode: "remote"             # "local" | "remote" — use remote since Whisper runs on workstation
  remote_url: "http://192.168.1.90:5000/transcribe"
  model: "large-v3-turbo"    # large-v3-turbo (recommended), large-v3, medium.en, small.en
  language: "en"
  skip_if_captions_available: true
  max_duration_minutes: 30

vision:
  enabled: true                   # Send images/video frames to Claude for visual text extraction
  max_images: 20                  # Instagram carousels cap at 20 slides; cover the full post
  ocr_model: "claude-haiku-4-5"   # Stage-1 OCR model (cheap); unset → single combined call on ai.model
  max_video_frames: 8             # Image blocks per video. Primary strategy is SCENE-CHANGE detection
                                  #   (a frame per content change — catches rolling burned-in captions),
                                  #   tiled into a frame_grid×frame_grid montage per block; falls back to
                                  #   evenly-spaced (10–80% of duration) when too few scene changes.
  frame_scene_threshold: 0.3      # ffmpeg scene-change sensitivity (0–1; lower = more frames)
  frame_grid: 2                   # 2 = 2×2 montage (4 frames per image block, same token cost as 1)
  skip_platforms: []              # Platforms to exclude (youtube always skipped automatically)

ai:
  model: "claude-sonnet-4-6"  # production analysis model (A/B verdict 2026-07-01: Sonnet ≈ Opus at 1/2 cost)
  max_tokens: 8192          # room for full multi-slide image_text OCR + all JSON fields
  temperature: 0.3          # sonnet-4-6 accepts temperature (unlike opus-4-8, which 400'd + was auto-stripped)
  effort: "medium"          # thinking depth for analysis + local fact-check (low|medium|high).
                            # medium is the cost/quality sweet spot. Auto-skipped for the Haiku
                            # OCR stage (Haiku 4.5 rejects effort) and not sent to the web-search
                            # fact-check loop (that stays thorough at default effort).
  max_content_chars: 20000
  max_retries: 4            # Anthropic SDK transient-error retries (honors Retry-After)

platforms:
  reddit:
    top_comments_count: 5
    include_op_top_level_comments: true
    delay_seconds: 1.0
  instagram:
    delay_seconds: 4.0
    cookie_expiry_days: 21
    cookie_warning_days_ahead: 7
  tiktok:
    no_watermark: true
    # Reconstruct the creator's verbatim caption (section headers on their own line, bullet lists,
    # blank lines between sections) from the video page's rehydration `itemStruct.contents[]`
    # instead of yt-dlp's flattened `description` (which strips every hard line break). Best-effort
    # + non-fatal: falls back to the yt-dlp description with line breaks heuristically restored.
    # (Legacy name `use_tdk_caption` is still honoured for back-compat.)
    use_rich_caption: true
    delay_seconds: 1.5
    cookie_expiry_days: 21
    cookie_warning_days_ahead: 7
    # TikTok streams are MUXED (single audio+video file), so bestvideo+bestaudio selectors
    # don't match. Target muxed H.264 directly (Obsidian/Electron can't decode H.265/bytevc1).
    # No height cap: TikTok is PORTRAIT, so its 720p stream is 720x1280 — a height<=1080 cap
    # would wrongly exclude it (1280>1080) and fall back to 540p. TikTok's H.264 tops out at
    # 720p anyway (1080p is H.265-only), so "best H.264" is the right target.
    video_quality: "best[vcodec=h264]/best[vcodec^=avc1]/best[height<=720]/best"
  facebook:
    delay_seconds: 7.0
    cookie_expiry_days: 30
    cookie_warning_days_ahead: 7
  youtube:
    download_video: false
    download_subtitles: true
    subtitle_language: "en"
    delay_seconds: 1.0
  generic:
    playwright_timeout_seconds: 30
    wait_for_network_idle: true
    auto_click_cookie_banners: true
    delay_seconds: 2.0

discord:
  channel_approvals: "SAVES-approvals"
  channel_log: "SAVES-logs"
  channel_alerts: "SAVES-alerts"
  channel_inbox: "SAVES-inbox"   # paste a URL here (or POST via a Discord webhook from
                                 # Android/Tasker) to queue a save — a creator URL triggers a
                                 # crawl. Optional: unset to disable. Not a required channel.
  auto_approve_on_timeout: false
  auto_approve_timeout_hours: 48

notes:
  include_metadata_section: true
  collapse_transcript: true
  date_format: "%Y-%m-%d"
  filename_max_length: 60
  tags_min: 10
  tags_max: 20

preferences:
  file: "/app/state/preferences.json"   # same state dir as the other JSON files (see paths)
  enabled: true

fact_checking:
  enabled: true
  model: "claude-sonnet-4-6"  # Cheaper model for fact-checking; falls back to ai.model if omitted
  topics:
    - health
    - political
    - finance
  web_search: true            # Let Claude search the web for verifiable evidence + source URLs
  web_search_topics:          # Topics eligible for web search — but ONLY via the on-demand
    - health                  # "Deep fact-check" button. The automatic on-arrival pass is
    - finance                 # always local-only (cheap flags: conflict-of-interest, media
    - political               # authenticity, dosage/safety); web search never runs on its own.
  max_searches: 5             # Default web-search cap for topics without a specific override below
  max_searches_by_topic:      # Per-topic web-search cap (on-demand button). A post matching
    health: 6                 # several topics uses the highest applicable cap. Recipes/food
    finance: 3                # always skip web search (local check only), regardless of these.
    political: 1
  max_tokens: 6000            # Fact-check responses include reasoning + cited sources
  include_images: false       # OCR (vision.ocr_model) already extracts image text; sending raw pixels would double-bill the same content
  jurisdiction: "Charlotte, NC (Mecklenburg County, North Carolina, USA)"  # used for tax/legal claim validity

travel_verification:
  enabled: true

credentials:
  keys:
    - ANTHROPIC_API_KEY
    - DISCORD_BOT_TOKEN