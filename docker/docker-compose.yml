version: "3.9"

# PORTABILITY: this file contains NO machine-specific paths. Host locations come from
# docker/.env (copy docker/.env.example and fill in — Compose reads it automatically
# when you run compose from this directory). config.yaml uses the canonical container
# paths (/vault, /media, /app/state) so the same image + config deploy anywhere.
services:
  saves-automation:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: saves_app
    restart: unless-stopped
    env_file: ../.env            # secrets: ANTHROPIC_API_KEY, DISCORD_BOT_TOKEN
    environment:
      - TZ=${TZ:-America/New_York}   # saved_date uses local time, not UTC
    volumes:
      # Host layout → canonical container paths (set the *_HOST vars in docker/.env)
      - "${VAULT_HOST}:/vault:rw"
      - "${MEDIA_HOST}:/media:rw"
      # One DIRECTORY for all runtime state (processing_state.json, pending_approvals.json,
      # preferences.json, queue_state.json). Never bind single files: Docker creates a directory
      # if the host file is missing, and os.replace() onto a file-mountpoint fails with EBUSY.
      - "${STATE_HOST}:/app/state:rw"
      # RW, not RO: the .txt cookie files are read-only in spirit, but the authenticated
      # provecho login is a Chromium *profile* directory (cookies/<host>_profile/) that
      # Playwright must WRITE to at runtime (lock files, IndexedDB). A :ro mount makes /crawl
      # and login-gated generic sites fail to launch the browser context.
      - ../cookies:/app/cookies:rw
      - ../config.yaml:/app/config.yaml:ro
      - ../logs:/app/logs:rw
      - instaloader-session:/root/.config/instaloader
      - whisper-cache:/root/.cache/whisper
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  instaloader-session:
  whisper-cache:
