# PORTABILITY: this file contains NO machine-specific paths. Host locations come from
# docker/.env (copy docker/.env.example and fill in — Compose reads it automatically
# when you run compose from this directory). config.yaml uses the canonical container
# paths (/vault, /media, /app/state) so the same image + config deploy anywhere.
#
# NO top-level `version:` key. Compose V2 deprecates it, and its presence makes Compose
# reject the v2-style service-level `mem_limit` below. (Same finding as the Forgejo
# stack on this NAS — OKAYNET/SELF HOST/forgejo.md §6.)
services:
  saves-automation:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Baked into the image so the account EXISTS inside the container (needed for
        # $HOME, `id`, and named-volume seeding). Must equal the `user:` below.
        SAVES_UID: ${SAVES_UID:-1031}
        SAVES_GID: ${SAVES_GID:-65536}
    container_name: saves_app
    restart: unless-stopped

    # NON-ROOT (Bora, 2026-08-06). Matches `id sa_saves` = uid 1031, service group 65536
    # (docker_service_accounts). This is what keeps notes/media/state owned by the service
    # account instead of root:root — root-owned notes in the vault cannot be edited or
    # deleted by Obsidian or over SMB. Changing this WITHOUT re-chowning the host
    # directories makes every write fail with EACCES.
    # SOP: OKAYNET/SOP/sop_synology_service_accounts.md · ownership map: docs/PROD_ROLLOUT.md §1.6.
    user: "${SAVES_UID:-1031}:${SAVES_GID:-65536}"

    # NO `group_add`. Vault access is granted by a DSM ACL naming sa_saves, which matches on
    # UID — group membership is irrelevant to it. Adding the container to a broad group
    # (`users` = every DSM account) to solve a permission problem is explicitly forbidden:
    # sop_synology_service_accounts.md (vault) Rule 1. If a POSIX-only path ever needs a group the DSM account
    # genuinely holds, add it here then — and never `users`.

    env_file: ../.env            # secrets: ANTHROPIC_API_KEY, DISCORD_BOT_TOKEN
    environment:
      - TZ=${TZ:-America/New_York}   # saved_date uses local time, not UTC
    volumes:
      # Host layout → canonical container paths (set the *_HOST vars in docker/.env)
      - "${VAULT_HOST}:/vault:rw"
      - "${MEDIA_HOST}:/media:rw"
      # One DIRECTORY for all runtime state (processing_state.json, pending_approvals.json,
      # preferences.json, queue_state.json). Never bind single files: Docker creates a directory
      # if the host file is missing, and os.replace() onto a file-mountpoint fails with EBUSY.
      - "${STATE_HOST}:/app/state:rw"
      # RW, not RO: the .txt cookie files are read-only in spirit, but the authenticated
      # provecho login is a Chromium *profile* directory (cookies/<host>_profile/) that
      # Playwright must WRITE to at runtime (lock files, IndexedDB). A :ro mount makes /crawl
      # and login-gated generic sites fail to launch the browser context.
      - ../cookies:/app/cookies:rw
      - ../config.yaml:/app/config.yaml:ro
      - ../logs:/app/logs:rw
      # Under $HOME of the non-root user, not /root (which it cannot write).
      - instaloader-session:/home/saves/.config/instaloader
      - whisper-cache:/home/saves/.cache/whisper

    # DECISION (Bora, 2026-08-05): cap memory. This NAS is no longer single-tenant — it also
    # runs the Forgejo forge (2g) + PostgreSQL (1g). Chromium/Playwright + ffmpeg were
    # previously uncapped, so one runaway extraction could OOM the forge alongside SAVES.
    # Tune SAVES_MEM_LIMIT in docker/.env against actual NAS RAM (preflight [6] reports it).
    mem_limit: ${SAVES_MEM_LIMIT:-3g}

    # WARNING: NEVER add `cpus:` (or cpu_quota / deploy.resources.limits.cpus) here. Synology
    # kernels are built without CFS bandwidth control, so any CPU quota is rejected by the
    # daemon — "NanoCPUs can not be set, as your kernel does not support CPU CFS scheduler"
    # — and the deploy FAILS OUTRIGHT. Memory limits work; CPU limits do not. Use Container
    # Manager's CPU-priority setting (cpu_shares) if you need relative weighting.
    # Confirmed on DSM 7.3.2 / Container Manager 24.0.2-1606 — OKAYNET/SELF HOST/forgejo.md §6.

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  instaloader-session:
  whisper-cache:
